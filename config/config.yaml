---
summarization:
  enable: true
  method: "batch"
  llm:
    model: nvidia/llama-3.3-nemotron-super-49b-v1.5
    base_url: http://10.187.20.22:8000/v1
    max_tokens: 2048
    temperature: 0.2
    top_p: 0.7
  embedding:
    model: "nvidia/llama-3.2-nv-embedqa-1b-v2"
    base_url: "http://embedding-nim:8000/v1/"
  params:
    batch_size: 1
    batch_max_concurrency: 20
  prompts:
    caption: "/no_think\nSummarize this emergency radio transcript as a dense paragraph. Include the incident type (fire, medical, accident, hazmat, or rescue), severity level, exact location with address or landmarks, names of callers or responders mentioned, any units dispatched, current status, and critical details for emergency response. Write in clear prose without bullet points or labeled fields."
    caption_summarization: "/no_think\nSummarize these emergency radio transcripts in the format start_time:end_time:summary. Each summary should describe what type of emergency, where it is located, who reported it, what units are responding, and current status. Format as bullet points with start_time:end_time: followed by a narrative summary. Don't return anything else except the bullet points."
    summary_aggregation: "/no_think\nYou are an emergency dispatch analyst. Aggregate these radio transcript summaries by grouping related incidents together. Merge timestamps that are within 30 seconds of each other. For each incident group, provide a consolidated narrative covering the emergency type, location, people involved, responding units, and status progression. Format as bullet points with start_time:end_time: followed by the aggregated narrative."

chat:
  rag: graph-rag # graph-rag or vector-rag
  advanced_features:
    cot: true
  citations:
    enabled: true
    include_metadata: true
    citation_fields: ["doc_id", "timestamp"]
    citation_template: "[{doc_id}] ({timestamp})"
    show_snippets: true
    snippet_length: 200
  params:
    batch_size: 2 
    top_k: 5  # Reduced from 15 - fewer but more relevant results
  llm:
    model: nvidia/llama-3.3-nemotron-super-49b-v1.5
    base_url: http://10.187.20.22:8000/v1
    max_tokens: 2048
    temperature: 0.5
  embedding:
    model: "nvidia/llama-3.2-nv-embedqa-1b-v2"
    base_url: "http://embedding-nim:8000/v1/"
  reranker:
    model: "nvidia/llama-3.2-nv-rerankqa-1b-v2"
    base_url: https://ai.api.nvidia.com/v1/retrieval/nvidia/llama-3_2-nv-rerankqa-1b-v2/reranking

notification:
  enable: false
  endpoint: "http://127.0.0.1:60000/via-alert-callback"
  llm:
    model: nvidia/llama-3.3-nemotron-super-49b-v1.5
    base_url: http://10.187.20.22:8000/v1
    max_tokens: 2048
    temperature: 0.2
    top_p: 0.7
